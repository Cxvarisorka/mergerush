<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15172b" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Merge Rush: place tiles, merge equal numbers and chain merges across the board." />
    <title>Merge Rush</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #15172b;
        color: #f2f2f7;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
        font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, system-ui, sans-serif;
      }
      #game {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      #game canvas {
        display: block;
        touch-action: none;
      }
      #safe-area-probe {
        position: fixed;
        inset: 0;
        visibility: hidden;
        pointer-events: none;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 0.08em;
        color: #a9aed6;
      }
    </style>
  </head>
  <body>
    <div id="boot">MERGE RUSH</div>
    <div id="game" role="application" aria-label="Merge Rush game board"></div>
    <div id="safe-area-probe" aria-hidden="true"></div>
    <div id="announcer" class="sr-only" aria-live="polite"></div>
    <noscript>Merge Rush needs JavaScript to run.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
